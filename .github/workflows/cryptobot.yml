name: Crypto bot
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Existing job ID issued by the authenticated service
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: cryptobot-${{ inputs.job_id || github.run_id }}
  cancel-in-progress: false
jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Execute claimed job
        env:
          CRYPTOBOT_WORKER_URL: ${{ secrets.CRYPTOBOT_WORKER_URL }}
          SLACK_TEAM_ID: ${{ secrets.SLACK_TEAM_ID }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_BOT_USER_ID: ${{ secrets.SLACK_BOT_USER_ID }}
          RUNNER_TOKEN: ${{ secrets.EXECUTOR_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          test -n "$JOB_ID"
          python runner/cloud_runner.py --job-id "$JOB_ID"
